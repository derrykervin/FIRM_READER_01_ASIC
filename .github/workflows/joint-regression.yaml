name: joint-regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  card-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Reproducible CARD candidate, not a mutable cross-repository main checkout.
      # Update this SHA explicitly after a CARD revision is validated.
      - uses: actions/checkout@v6
        with:
          repository: derrykervin/FIRM_CARD_01_ASIC
          ref: 4ea89ba3d056db4405229a95074044f11587c652
          path: .reference/card
          persist-credentials: false
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Capture both source revisions
        run: |
          mkdir -p reports/current
          git rev-parse HEAD > reports/current/reader-sha.txt
          git -C .reference/card rev-parse HEAD > reports/current/card-sha.txt
          iverilog -V > reports/current/iverilog-version.txt 2>&1
      - name: Retain legacy protocol and fault matrix
        run: bash tools/check.sh .reference/card
      - name: UART asynchronous phase, rate and jitter matrix
        run: python3 -B tools/run_uart_async.py --output reports/current/uart-async
      - name: Preserve joint regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: card-reader-joint-evidence
          path: reports/current/
          if-no-files-found: error

  current_tt_pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpb: [16, 347]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate immutable paired revision
        run: test "$(cat .github/card-revision.txt)" = "4ea89ba3d056db4405229a95074044f11587c652"
      - uses: actions/checkout@v6
        with:
          repository: derrykervin/FIRM_CARD_01_ASIC
          ref: 4ea89ba3d056db4405229a95074044f11587c652
          path: .reference/card
          persist-credentials: false
      - name: Install independent simulator and reference crypto
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          python3 -m pip install -r .reference/card/FIRM-SYSTEM-SPECS/requirements-reference.txt
      - name: Current complete TT UART CPU MMIO I2C identity proof and replay checks
        run: |
          mkdir -p reports/current-pair
          git rev-parse HEAD > reports/current-pair/reader-sha.txt
          git -C .reference/card rev-parse HEAD > reports/current-pair/card-sha.txt
          iverilog -V > reports/current-pair/iverilog-version.txt 2>&1
          python3 -B experimental/identity_enumeration/check_system.py --card .reference/card --out reports/current-pair --cpb "${{ matrix.cpb }}" --simulation-timeout 1200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: current-tt-pair-${{ matrix.cpb }}
          path: reports/current-pair/
          if-no-files-found: error

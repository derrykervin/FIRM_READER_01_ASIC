name: reader-shared-digest
on:
  workflow_dispatch:
  push:
    branches: ['engineering/reader-digest-*']
    paths: ['.github/workflows/reader-shared-digest.yml']
  pull_request:
    paths: ['.github/workflows/reader-shared-digest.yml']
permissions:
  contents: read
jobs:
  qualified-byte-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install independent Icarus
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Materialize exact reviewed source
        shell: bash
        run: |
          python3 - <<'FIRM_SNAPSHOT'
          import base64,gzip,hashlib,json
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='42d7ff6fb4dd0632fe4457dfd52f32d3f2c8b333b1e1e4ff4040fef327976db6'
          bundle=json.loads(raw)
          required=['src/firm_reader_proof_ctrl.v','experimental/shared_digest/check.py','experimental/shared_digest/tb_shared_digest.v','experimental/identity_enumeration/check_reader.py','experimental/identity_enumeration/tb_identity_reader.v','experimental/proof_transport/check.py','experimental/proof_transport/tb_proof_ctrl.v','experimental/proof_transport/firm_reader_proof_ctrl.v']
          assert all(n in bundle['files'] for n in required)
          for name,item in bundle['files'].items():
           rel=Path(name);assert not rel.is_absolute() and '..' not in rel.parts
           data=base64.b64decode(item['content_base64'],validate=True)
           assert hashlib.sha256(data).hexdigest()==item['sha256']
           assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['git_blob_sha1']
           path=Path('qualified-reader')/rel;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          Path('qualified-reader/source-provenance.json').write_text(json.dumps(bundle,indent=2)+'\n')
          print('PASS snapshot files',len(bundle['files']),'source',bundle['source_sha'])
          FIRM_SNAPSHOT
      - name: Paired digest and retained standalone controls
        run: |
          iverilog -V > iverilog-version.txt 2>&1
          python3 qualified-reader/experimental/shared_digest/check.py --out reports/differential
          python3 qualified-reader/experimental/identity_enumeration/check_reader.py --out reports/identity
          python3 qualified-reader/experimental/proof_transport/check.py --out reports/standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-shared-digest-qualified-source
          path: |
            qualified-reader/
            reports/
            iverilog-version.txt

name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        with:
          pdk: sky130A

      - name: Validate signoff collector failure controls
        run: python3 -B -m unittest discover -s tools -p 'test_collect_signoff.py' -v

      - name: Collect current build signoff evidence
        run: >-
          python3 -B tools/collect_signoff.py
          --logs runs/wokwi --submission tt_submission --output signoff-evidence
          --source-sha "$GITHUB_SHA" --source-run "$GITHUB_RUN_ID"
          --top tt_um_derrykervin_firm_reader_01

      - name: Preserve current build signoff evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signoff-evidence
          path: signoff-evidence/
          if-no-files-found: error

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
